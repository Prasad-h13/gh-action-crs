name: 13 - caching 

on: 
    workflow_dispatch:
        inputs:
            use-cache:
                description: whether to excute cache step
                type: boolean
                default: true

jobs:
    build:
        runs-on: ubuntu-latest
        defaults: 
            run: 
                working-directory: 13-caching/react-app
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: setup node
              uses: actions/setup-node@v3
              with:
                node-version: '25.x'
            - name: Install dependencies
              run: npm ci
            - name: Testing
              run: npm run test
            - name: Building
              run: npm run build
            - name: deploying to nonprod
              run: echo "Deploying to nonprod"
        # 1. checkout the code
        # 2. Install dependencies
        # 3. linting, formatting unit testing, building
        # 4. deploying to a nonprod environmnet