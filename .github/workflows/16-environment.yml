name: 16 - working with Environment 
run-name: 16 - working with environmnet | env - ${{ inputs.target-env }}
on:
    workflow_dispatch:
        inputs:
            target-env:
                type: environment
                default: staging
jobs:
    echo:
        runs-on: ubuntu-latest
        environment: ${{ inputs.target-env }}
        env:
            my-envir-value: ${{ vars.MY_ENV_VALUE || "default value" }}
        steps:
            - name: Echo vars
              run: |
                echo "Env variable: ${{ env.my-envir-value }}"