name: 16 - working with Environment 
on:
    workflow_dispatch:
        inputs:
            target-env:
                type: environment
                default: staging
jobs:
    Deploy-staging:
        runs-on: ubuntu-latest
        environment: staging
        env:
            my-envir-value: ${{ vars.MY_ENV_VALUE || 'default value' }}
        steps:
            - name: Echo vars
              run: |
               echo "Deploying to staging"
    
    e2e-test:
        runs-on: ubuntu-latest
        needs: Deploy-staging
        steps:
            - name: e2e-test
              run: echo "Running E2E"

    Deploy-prod:
        runs-on: ubuntu-latest
        needs: e2e-test
        environment: prod
        env:
            my-envir-value: ${{ vars.MY_ENV_VALUE || 'defaultvalue' }}
        steps:
            - name: Echo vars
              run: |
                echo "Deploying to prod"
